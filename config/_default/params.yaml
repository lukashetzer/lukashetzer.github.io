hugoblox:
  schema: "2.0"

  identity:
    name: "Lukas Hetzer"
    type: person
    tagline: "Research Associate | Hertie School"
    description: >-
      Research Associate at the Jacques Delors Centre at the Hertie School.
      Research on European politics, crisis governance, political communication,
      and public opinion using surveys, experiments, and computational text analysis.

  theme:
    mode: system
    pack: minimal
    colors:
      primary: "amber"
      secondary: "amber"
      neutral: "gray"

  typography:
    font: sans
    size: md

  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true

  footer:
    style: minimal
    language_switcher: false
    text: '<a href="/impressum/">Impressum / Legal Notice</a>'

  copyright:
    notice: "© {year} {name} This work is licensed under CC BY NC ND 4.0"

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: false

  search:
    enable: true
